name: Release

# Pushing a tag like v0.2.0 builds the store packages from that exact commit, checks
# everything, signs build provenance and creates a DRAFT GitHub release. Publishing the
# release and uploading to the stores stay manual (see docs/RELEASING.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers to this environment in the repository settings (public repos).
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # sign build provenance with Sigstore
      attestations: write # store the attestation on GitHub
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "Tag $TAG does not match package.json ($version)"; exit 1; fi
      - run: npm ci # install scripts disabled via .npmrc
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/security-scan.mjs --audit
      - name: Build the store packages
        run: |
          npm run zip
          npm run zip:firefox
          cd .output
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '.output/*.zip'
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          gh release create "$TAG" --draft --verify-tag --title "Folkweb $TAG" --notes-file release-notes.md .output/*.zip .output/SHA256SUMS.txt
