name: Release

# Pushing a tag like v0.2.0 builds the store packages from that exact commit, checks
# everything, signs build provenance and creates a DRAFT GitHub release. Publishing the
# release and uploading to the stores stay manual (see docs/RELEASING.md).
#
# Two jobs, so the toolchain never holds a write token:
#   build   — read-only token; runs npm ci, the full check and the zips.
#   publish — runs no repository code or dependencies; it only attests the zips built
#             above and creates the draft release, after a maintainer approves it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release builds from a clean install (no cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "Tag $TAG does not match package.json ($version)"; exit 1; fi
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        # Outside the project folder, so nothing extra ends up in the sources zip.
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - run: npm ci # install scripts disabled via .npmrc
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/security-scan.mjs --audit
      - name: Build the store packages
        run: |
          npm run zip
          npm run zip:firefox
          mkdir release
          cp "$RUNNER_TEMP/release-notes.md" release/
          cp .output/*.zip release/
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment in the repository settings (public repos).
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # sign build provenance with Sigstore
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the files are the ones built
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*.zip'
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Folkweb $TAG" --notes-file release/release-notes.md \
            release/*.zip release/SHA256SUMS.txt
