name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci # install scripts disabled via .npmrc
      - run: npm run prepare:wxt
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Browser smoke tests: the built extension in Chromium against local pages (e2e/).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lint:firefox
      - run: node scripts/security-scan.mjs --audit
