name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci # install scripts disabled via .npmrc
      - run: npm run prepare:wxt
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Browser smoke tests: the built extension in Chromium against local pages (e2e/).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lint:firefox
      - run: node scripts/security-scan.mjs --audit

  # Every commit in a pull request is signed off by its author (DCO, see CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Run the checker from the base commit, so a pull request can't weaken the check
        # that judges it. Only the pull request that adds the checker uses its own copy.
        run: |
          if git cat-file -e "$BASE:scripts/check-dco.mjs" 2>/dev/null; then
            git show "$BASE:scripts/check-dco.mjs" > "$RUNNER_TEMP/check-dco.mjs"
          else
            cp scripts/check-dco.mjs "$RUNNER_TEMP/check-dco.mjs"
          fi
          node "$RUNNER_TEMP/check-dco.mjs" "$BASE" "$HEAD"
